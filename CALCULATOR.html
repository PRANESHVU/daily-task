<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator UI</title>
  <style>
    body{
      background-color:rgb(231, 243, 153);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100dvh;
      font-family: Arial,sans-serif;
    }
    .calculator{
      background-color: #c0bdbd;
      border-radius:20px;
      padding:20px;
      width:260px;
    }
    .title{
      font-weight:bold;
      margin-bottom:12px;
      text-align:center;
      font-size:20px;
    }
    .display{
      background-color: #f4eded;
      border-radius:10px;
      padding:10px;
      font-size:24px;
      text-align:right;
      margin-bottom:15px;
    }
    .buttons{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:10px;
    }
    button{
      border:none;
      border-radius:100%;
      height:55px;
      font-size:22px;
      cursor: pointer;
      color: #fff;
    }
    .lightgray{
        background-color:rgb(165, 161, 161);
    }
    .gray{
      background-color:rgb(78, 76, 76);
    }
    .orange{
      background-color:rgb(232, 143, 35);
    }
    button:active{
      opacity:0.5;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="title">Welcome to Calculator</div>
    <div class="display">0</div>
    <div class="buttons">
      <button class="lightgray" style="color:black;"><b>AC</b></button>
      <button class="lightgray" style="color:black;"><b>⇐</b></button>
      <button class="lightgray" style="color:black;"><b>%</b></button>
      <button class="orange">÷</button>
      <button class="gray">7</button>
      <button class="gray">8</button>
      <button class="gray">9</button>
      <button class="orange">x</button>
      <button class="gray">4</button>
      <button class="gray">5</button>
      <button class="gray">6</button>
      <button class="orange">-</button>
      <button class="gray">1</button>
      <button class="gray">2</button>
      <button class="gray">3</button>
      <button class="orange">+</button>
      <button class="gray">0</button>
      <button class="gray">00</button>
      <button class="gray">.</button>
      <button class="orange">=</button>
    </div>
  </div>
</body>
</html>
